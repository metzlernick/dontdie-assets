name: Build Cosmetic Production Reference Kit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-cosmetic-production-reference-kit.yml'
      - 'cosmetic-art/00_GENERATION_UPLOAD_ZIP_STANDARD.md'
      - 'cosmetic-art/FRESH_AGENT_PRODUCTION_HANDOFF.md'
      - 'cosmetic-art/PRODUCTION_RUNTIME_ASSET_MANIFEST.md'
      - 'cosmetic-art/GENERATION_EXECUTION_CONTRACT.md'
      - 'cosmetic-art/PRODUCTION_PACKAGE_REGRESSION_GATES.md'
      - 'cosmetic-art/PRODUCTION_STAGE_ORCHESTRATION.md'
      - 'cosmetic-art/HATS_PRODUCTION_WORKFLOW.md'
      - 'cosmetic-art/RIGHT_ARM_PRODUCTION_WORKFLOW.md'
      - 'cosmetic-art/DONT_DIE_COSMETIC_ART_SPEC.md'
      - 'cosmetic-art/REPEATABLE_PRODUCTION_WORKFLOW.md'
      - 'cosmetic-art/PRODUCTION_SESSION_STARTER.txt'
      - 'cosmetic-art/CANONICAL_REGISTRATION_SYSTEM.md'
      - 'cosmetic-art/ACCESSORY_FACE_PRODUCTION_WORKFLOW.md'
      - 'cosmetic-art/ARMOR_OUTFIT_PRODUCTION_WORKFLOW.md'
      - 'cosmetic-art/ARMOR_STAGE_B_DETERMINISTIC_REGISTRATION.md'
      - 'cosmetic-art/LEFT_ARM_PRODUCTION_PROMPT_TEMPLATE.txt'
      - 'cosmetic-art/LEFT_ARM_ZERO_CONTACT_WORKFLOW.md'
      - 'cosmetic-art/archive-calibration/HAT_EXACT_MAIN_HERO_4X4.png'
      - 'cosmetic-art/archive-calibration/HAT_EXTRACTION_MASK_4X4.png'
      - 'cosmetic-art/reference-sheets/**'
      - 'cosmetic-art/reference-pack/**'
      - 'cosmetic-art/approved-art/**'
      - 'cosmetic-art/templates/**'
      - 'cosmetic-art/registration/**'

permissions:
  contents: read

jobs:
  build-reference-kit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble permanent production reference kit
        shell: bash
        run: |
          set -euo pipefail
          KIT="DONT_DIE_COSMETIC_PRODUCTION_REFERENCES"
          mkdir -p "$KIT/cosmetic-art"

          cp -a cosmetic-art/reference-sheets "$KIT/cosmetic-art/"
          cp -a cosmetic-art/reference-pack "$KIT/cosmetic-art/"
          cp -a cosmetic-art/approved-art "$KIT/cosmetic-art/"
          cp -a cosmetic-art/templates "$KIT/cosmetic-art/"
          cp -a cosmetic-art/registration "$KIT/cosmetic-art/"

          mkdir -p "$KIT/cosmetic-art/validated-hats"
          cp cosmetic-art/archive-calibration/HAT_EXACT_MAIN_HERO_4X4.png "$KIT/cosmetic-art/validated-hats/"
          cp cosmetic-art/archive-calibration/HAT_EXTRACTION_MASK_4X4.png "$KIT/cosmetic-art/validated-hats/"

          for f in \
            00_GENERATION_UPLOAD_ZIP_STANDARD.md \
            ACCESSORY_FACE_PRODUCTION_WORKFLOW.md \
            ARMOR_OUTFIT_PRODUCTION_WORKFLOW.md \
            ARMOR_STAGE_B_DETERMINISTIC_REGISTRATION.md \
            CANONICAL_REGISTRATION_SYSTEM.md \
            DONT_DIE_COSMETIC_ART_SPEC.md \
            FRESH_AGENT_PRODUCTION_HANDOFF.md \
            GENERATION_EXECUTION_CONTRACT.md \
            PRODUCTION_PACKAGE_REGRESSION_GATES.md \
            PRODUCTION_STAGE_ORCHESTRATION.md \
            HATS_PRODUCTION_WORKFLOW.md \
            RIGHT_ARM_PRODUCTION_WORKFLOW.md \
            LEFT_ARM_PRODUCTION_PROMPT_TEMPLATE.txt \
            LEFT_ARM_ZERO_CONTACT_WORKFLOW.md \
            PRODUCTION_RUNTIME_ASSET_MANIFEST.md \
            PRODUCTION_SESSION_STARTER.txt \
            REPEATABLE_PRODUCTION_WORKFLOW.md; do
            cp "cosmetic-art/$f" "$KIT/cosmetic-art/$f"
          done

          cat > "$KIT/README.txt" <<'EOF'
          DON'T DIE COSMETIC PRODUCTION REFERENCES — PERMANENT FALLBACK KIT

          Use this ZIP only when a fresh runtime cannot retrieve required binary assets from the live GitHub repo.

          NORMAL USER CONTRACT
          - Provide CATEGORY + ONE cosmetic brief.
          - One brief generates four variants in one 4×1 strip.
          - Never hunt for individual canonical assets.
          - The agent selects required references and builds flat minimal generation-upload ZIPs.
          - The agent owns stage tracking and deterministic processing.

          This fallback ZIP is a portability library, NOT a generation input set. Never upload the whole reference library to image generation as coequal references.

          The live repository wins for newer workflow/rule text.
          EOF

          zip -r -9 DONT_DIE_COSMETIC_PRODUCTION_REFERENCES.zip "$KIT"
          test -s DONT_DIE_COSMETIC_PRODUCTION_REFERENCES.zip
          unzip -t DONT_DIE_COSMETIC_PRODUCTION_REFERENCES.zip

      - name: Upload production reference kit
        uses: actions/upload-artifact@v4
        with:
          name: DONT_DIE_COSMETIC_PRODUCTION_REFERENCES
          path: DONT_DIE_COSMETIC_PRODUCTION_REFERENCES.zip
          if-no-files-found: error
          retention-days: 90
